<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AmpliFi Wealth Services | Protect Income. Protect Family. Build Legacy.</title>

<meta name="description" content="Straight answers about term life insurance, retirement income, long-term care, and tax-efficient legacy planning.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --teal:#17A8C8;
  --orange:#FD8259;
  --gold:#FEC64E;
  --green:#3FAE7D;
  --navy:#023A85;
  --ink:#142433;
  --muted:#5C6A78;
  --white:#FFFFFF;
  --offwhite:#F7F9FB;
  --line:rgba(2,58,133,.12);
  --shadow:0 24px 55px -30px rgba(2,58,133,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,sans-serif;
  color:var(--ink);
  background:#fff;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{
  font-family:Fraunces,serif;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--navy);
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:0 32px;
}

@media(max-width:640px){
  .wrap{
    padding:0 20px;
  }
}

.eyebrow{
  font-family:"Work Sans",sans-serif;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:.72rem;
  font-weight:700;
  color:var(--orange);
}

/* TOP BAR */

.topbar{
  background:var(--navy);
  color:rgba(255,255,255,.92);
  font:500 .78rem "Work Sans",sans-serif;
}

.topbar .wrap{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding-top:10px;
  padding-bottom:10px;
}

.topbar-links{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.topbar a:hover{
  color:var(--gold);
}

/* NAVIGATION */

.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
}

.nav .wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:13px;
  padding-bottom:13px;
  gap:20px;
}

.logo img{
  width:118px;
  height:auto;
  display:block;
}

.navlinks{
  display:flex;
  align-items:center;
  gap:22px;
  font:600 .79rem "Work Sans",sans-serif;
}

.navlinks a:hover{
  color:var(--teal);
}

.navcta{
  background:var(--navy);
  color:#fff!important;
  padding:10px 17px;
  border-radius:5px;
}

@media(max-width:900px){
  .navlinks a:not(.navcta){
    display:none;
  }
}

/* HERO */

.hero{
  background:linear-gradient(130deg,#f9fbfd 0%,#f5f9fb 65%,#eef8f7 100%);
  padding:88px 0 84px;
  border-bottom:1px solid var(--line);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
  align-items:center;
}

.hero h1{
  font-size:clamp(2.5rem,5vw,4rem);
  line-height:1.03;
  margin-top:14px;
  max-width:720px;
}

.hero h1 em{
  font-style:italic;
  background:linear-gradient(90deg,var(--teal),var(--green));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero-lede{
  font-size:1.12rem;
  color:var(--muted);
  max-width:630px;
  margin-top:22px;
}

.hero-actions{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 23px;
  border-radius:5px;
  font:700 .88rem "Work Sans",sans-serif;
  transition:.2s;
}

.btn-primary{
  background:var(--navy);
  color:#fff;
}

.btn-primary:hover{
  background:var(--teal);
}

.btn-ghost{
  border:1.5px solid var(--navy);
  color:var(--navy);
}

.btn-ghost:hover{
  border-color:var(--teal);
  color:var(--teal);
}

.hero-proof{
  margin-top:33px;
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:.83rem;
}

.hero-proof span:before{
  content:"✓";
  color:var(--green);
  font-weight:800;
  margin-right:6px;
}

.question-stack{
  display:grid;
  gap:12px;
}

.qbubble{
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:18px 20px;
  border-radius:12px;
  font:600 .95rem "Work Sans",sans-serif;
}

.qbubble:nth-child(2){
  margin-left:40px;
  border-left:4px solid var(--orange);
}

.qbubble:nth-child(3){
  margin-right:30px;
  border-left:4px solid var(--gold);
}

.qbubble:nth-child(4){
  margin-left:25px;
  border-left:4px solid var(--green);
}

.qbubble:nth-child(5){
  margin-right:45px;
  border-left:4px solid var(--teal);
}

@media(max-width:880px){
  .hero-grid{
    grid-template-columns:1fr;
  }

  .hero-side{
    display:none;
  }
}

/* FOUR MAIN PATHS */

.paths{
  padding:42px 0;
  background:var(--navy);
}

.paths-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:rgba(255,255,255,.16);
}

.path{
  background:var(--navy);
  color:#fff;
  padding:25px 22px;
  transition:.2s;
}

.path:hover{
  background:#064796;
}

.path small{
  display:block;
  color:var(--gold);
  font:700 .65rem "Work Sans",sans-serif;
  text-transform:uppercase;
  letter-spacing:.14em;
}

.path strong{
  display:block;
  margin-top:6px;
  font:600 1.05rem Fraunces,serif;
}

.path span{
  display:block;
  margin-top:8px;
  color:rgba(255,255,255,.7);
  font-size:.78rem;
}

@media(max-width:800px){
  .paths-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){
  .paths-grid{
    grid-template-columns:1fr;
  }
}

/* SECTIONS */

.section{
  padding:92px 0;
}

.section.alt{
  background:var(--offwhite);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.section-head{
  max-width:760px;
  margin-bottom:44px;
}

.section-head h2{
  font-size:clamp(2rem,3.3vw,2.8rem);
  margin-top:12px;
  line-height:1.12;
}

.section-head p{
  margin-top:14px;
  color:var(--muted);
  font-size:1.02rem;
}

/* OBJECTIONS */

.objection-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.objection{
  padding:20px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  font:600 .9rem "Work Sans",sans-serif;
  position:relative;
}

.objection:after{
  content:"→";
  position:absolute;
  right:17px;
  color:var(--orange);
}

@media(max-width:900px){
  .objection-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){
  .objection-grid{
    grid-template-columns:1fr;
  }
}

/* Q&A SECTIONS */

.qa-section{
  scroll-margin-top:85px;
}

.qa-grid{
  display:grid;
  grid-template-columns:.86fr 1.14fr;
  gap:58px;
  align-items:start;
}

.qa-title{
  position:sticky;
  top:110px;
}

.number{
  font:700 .72rem "Work Sans",sans-serif;
  color:var(--orange);
  letter-spacing:.16em;
  text-transform:uppercase;
}

.qa-title h2{
  font-size:clamp(2rem,3vw,2.7rem);
  margin:10px 0 14px;
  line-height:1.1;
}

.qa-title p{
  color:var(--muted);
}

.qa-cards{
  display:grid;
  gap:14px;
}

.qa-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 30px -25px rgba(2,58,133,.35);
}

.qa-card summary{
  list-style:none;
  cursor:pointer;
  padding:21px 54px 21px 24px;
  font:700 .94rem "Work Sans",sans-serif;
  color:var(--ink);
  position:relative;
}

.qa-card summary::-webkit-details-marker{
  display:none;
}

.qa-card summary:after{
  content:"+";
  position:absolute;
  right:22px;
  top:17px;
  font-size:1.5rem;
  color:var(--teal);
}

.qa-card details[open] summary:after{
  content:"−";
}

.answer{
  padding:0 24px 22px;
  color:var(--muted);
  font-size:.94rem;
}

.answer strong{
  color:var(--ink);
}

.cta-inline{
  display:inline-block;
  margin-top:14px;
  color:var(--navy);
  font:700 .78rem "Work Sans",sans-serif;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-bottom:2px solid var(--gold);
}

.callout{
  margin-top:22px;
  background:var(--navy);
  color:#fff;
  border-radius:10px;
  padding:26px;
}

.callout .label{
  color:var(--gold);
  font:700 .68rem "Work Sans",sans-serif;
  text-transform:uppercase;
  letter-spacing:.13em;
}

.callout p{
  margin-top:8px;
  color:rgba(255,255,255,.84);
  font-size:.92rem;
}

@media(max-width:840px){
  .qa-grid{
    grid-template-columns:1fr;
    gap:30px;
  }

  .qa-title{
    position:static;
  }
}

/* CALCULATOR */

.calc-shell{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.calc-head{
  padding:28px 30px;
  background:linear-gradient(120deg,#023A85,#0751a8);
  color:#fff;
}

.calc-head h3{
  color:#fff;
  font-size:1.55rem;
}

.calc-head p{
  color:rgba(255,255,255,.78);
  margin-top:8px;
  font-size:.9rem;
}

.rate-chip{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:20px;
  background:rgba(255,255,255,.11);
  font:600 .7rem "Work Sans",sans-serif;
  color:rgba(255,255,255,.86);
}

.calc-body{
  display:grid;
  grid-template-columns:.95fr 1.05fr
